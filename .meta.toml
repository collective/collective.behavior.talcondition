# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
# Not imported, but needed: plone.app.vocabularies provides the Roles
# vocabulary of the behavior, and the test layer applies the
# plone-content profile of plone.app.contenttypes.
dependencies_ignores = "['zestreleaser.towncrier', 'zest.releaser', 'zope.testrunner', 'plone.app.vocabularies', 'plone.app.contenttypes']"

[tox]
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt"}

[github]
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    "dependencies",
    ]
